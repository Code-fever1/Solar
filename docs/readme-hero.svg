<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Voltix opening dashboard</title>
  <desc id="desc">First screen of Voltix: live solar, home load, grid exchange, and the active meter.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122033"/>
      <stop offset="0.55" stop-color="#0B121C"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162232"/>
      <stop offset="1" stop-color="#101A28"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F5C42E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="#070B12"/>
  <circle cx="220" cy="80" r="180" fill="#F5C42E" opacity="0.06"/>
  <circle cx="980" cy="140" r="220" fill="#4A85FF" opacity="0.06"/>

  <g filter="url(#soft)">
    <rect x="48" y="36" width="1104" height="548" rx="28" fill="url(#sky)"/>
  </g>

  <circle cx="96" cy="92" r="22" fill="#121C2A" stroke="#F5C42E" stroke-width="2"/>
  <path d="M88 98 L96 84 L104 98 Z" fill="none" stroke="#F4F7FB" stroke-width="1.6"/>
  <rect x="100" y="86" width="12" height="8" rx="1" fill="#3B82F6"/>
  <path d="M108 108 L116 96 L120 104 L112 116 Z" fill="#F5C42E"/>

  <text x="132" y="88" fill="#F4F7FB" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Voltix</text>
  <text x="132" y="112" fill="#8EA0B5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The house, the sun, and both meters. One look.</text>

  <rect x="900" y="72" width="204" height="36" rx="18" fill="#12301F" stroke="#32E56B" stroke-opacity="0.45"/>
  <circle cx="922" cy="90" r="5" fill="#32E56B"/>
  <text x="936" y="96" fill="#8FF0B0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Hybrid · Exporting</text>

  <path d="M250 250 C 400 250, 430 210, 600 210" fill="none" stroke="#F5C42E" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M600 210 C 760 210, 800 250, 950 250" fill="none" stroke="#4A85FF" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M600 250 L600 330" fill="none" stroke="#2DDB6C" stroke-width="2.2" stroke-linecap="round"/>

  <g>
    <circle cx="250" cy="250" r="54" fill="#1A2433" stroke="#F5C42E" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="250" y="242" text-anchor="middle" fill="#F5C42E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">SOLAR</text>
    <text x="250" y="268" text-anchor="middle" fill="#F7F3E6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">3.80</text>
    <text x="250" y="318" text-anchor="middle" fill="#C9B56A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">kW from the roof</text>
  </g>

  <g>
    <circle cx="600" cy="210" r="62" fill="#142033" stroke="#F4F7FB" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="600" y="200" text-anchor="middle" fill="#9BB0C6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">HOME</text>
    <text x="600" y="230" text-anchor="middle" fill="#F4F7FB" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">0.82</text>
    <text x="600" y="292" text-anchor="middle" fill="#8EA0B5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">kW in the house</text>
  </g>

  <g>
    <circle cx="950" cy="250" r="54" fill="#121C2E" stroke="#6E9BFF" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="950" y="242" text-anchor="middle" fill="#8EB4FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">GRID</text>
    <text x="950" y="268" text-anchor="middle" fill="#E7EEFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">2.90‘</text>
    <text x="950" y="318" text-anchor="middle" fill="#8EA0B5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">kW back to WAPDA</text>
  </g>

  <rect x="88" y="360" width="1024" height="186" rx="22" fill="url(#sheet)" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="124" y="398" fill="#8EA0B5" font-size="12">Solar</text>
    <text x="124" y="426" fill="#32E56B" font-size="18" font-weight="700">Online</text>

    <text x="330" y="398" fill="#8EA0B5" font-size="12">Inverter</text>
    <text x="330" y="426" fill="#32E56B" font-size="18" font-weight="700">Healthy</text>

    <text x="560" y="398" fill="#8EA0B5" font-size="12">Grid</text>
    <text x="560" y="426" fill="#6E9BFF" font-size="18" font-weight="700">Available</text>

    <text x="790" y="398" fill="#8EA0B5" font-size="12">Active meter</text>
    <text x="790" y="426" fill="#F4F7FB" font-size="18" font-weight="700">Meter 2</text>

    <line x1="118" y1="452" x2="1082" y2="452" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <text x="124" y="488" fill="#8EA0B5" font-size="12">Received today</text>
    <text x="124" y="516" fill="#F4F7FB" font-size="20" font-weight="700">18.4 kWh</text>

    <text x="430" y="488" fill="#8EA0B5" font-size="12">Used today</text>
    <text x="430" y="516" fill="#F4F7FB" font-size="20" font-weight="700">11.2 kWh</text>

    <text x="720" y="488" fill="#8EA0B5" font-size="12">Meter 2 remaining</text>
    <text x="720" y="516" fill="#F8C653" font-size="20" font-weight="700">64 units</text>
  </g>
</svg>
